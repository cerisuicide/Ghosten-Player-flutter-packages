name: Fork CI

on:
  push:
    branches:
      - fork-main
      - "feature/**"
  pull_request:
    branches:
      - fork-main

permissions:
  contents: read

concurrency:
  group: fork-packages-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true
      - name: Resolve package dependencies
        working-directory: video_player
        run: flutter pub get
      - name: Analyze package
        working-directory: video_player
        run: flutter analyze
      - name: Run Dart tests
        working-directory: video_player
        run: flutter test
      - name: Create Android test host
        shell: bash
        run: |
          flutter create --platforms=android --org=com.ghosten.ci /tmp/ghosten-player-ci
          cd /tmp/ghosten-player-ci
          flutter pub add video_player --path "${GITHUB_WORKSPACE}/video_player"
          flutter build apk --debug
      - name: Run Android unit tests
        run: cd /tmp/ghosten-player-ci/android && ./gradlew :video_player:testDebugUnitTest --no-daemon
